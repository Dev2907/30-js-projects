<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Prism</title>
        <meta name="author" content="Dev" />
        <link rel="stylesheet" href="./stylesheet.css" />
        <meta name="viewport" content="width=device-width, initial-scale = 1.0" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://kit.fontawesome.com/d9efd81c39.js" crossorigin="anonymous"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Shantell+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    </head>
    <body class="m-0">
        <body>
            <div class="container-fluid">
                <div class="row">
                    <!--Sidebar-->
                    <nav class="col-md-2 sidebar d-none d-lg-block">
                        <div class="appLogo d-flex justify-content-center align-items-end mb-3"></div>
                        <div class="sidebarItems ps-3 colorBGrey">
                            <div style="color: #98BB25;"><h5><i class="fa-solid fa-gauge me-3"></i>Dashboard</h5></div>
                            <div><h5><i class="fa-solid fa-stopwatch-20 me-3"></i>Timer</h5></div>
                            <div><h5><i class="fa-solid fa-bullseye me-3"></i>To Do</h5></div>
                            <div><h5><i class="fa-regular fa-note-sticky me-3"></i>Notes</h5></div>
                        </div>
                    </nav>

                    <!--Main page-->
                    <main class="col-md ml-sm-auto main-content">

                        <div class="grid-container py-3 gap-3">
                            <!--Quote Block-->
                            <div class="grid-box shadow quote rounded d-flex justify-content-center align-items-center">
                                <div>
                                    <div class="fs-5 px-5 quoteTxt"></div>
                                    <div class="fs-6 colorBGrey d-flex justify-content-end author"></div>
                                </div>
                            </div>

                            <!--Stopwatch Block-->
                            <div class="grid-box shadow timer rounded">
                                <div class="colorBlue px-3 pt-2 fs-5">
                                    <i class="fa-solid fa-stopwatch me-2"></i><span>Stopwatch</span>
                                </div>

                                <div class="d-flex align-items-center justify-content-center gap-5 h-75">
                                    <div class="fs-1" >
                                        <div class="text-center">
                                            <span>0</span> : <span>0</span> : <span>0</span>
                                        </div>
                                        <hr/>
                                        <div>
                                            <button class="btn"><i class="fs-2 colorWhite fa-regular fa-flag fw-light"></i></button>
                                            <button class="btn"><i class="fs-2 colorBlue fa-regular fa-circle-play"></i></button>
                                            <button class="btn"><i class="fs-2 colorWhite fa-solid fa-rotate-right"></i></button>
                                        </div>
                                    </div>
                                    <div class="stopwarchDivider h-100"></div>
                                    <div class="h-100">
                                        <table class="stopwatchLaps">
                                            <thead >
                                                <td class="p-1 colorBlue ">Lap</td>
                                                <td class="p-1">Lap time</td>
                                                <td class="p-1">Overall time</td>
                                            </thead>
                                            <tr>
                                                <td class="p-1 colorBlue">
                                                    0
                                                </td>
                                                <td class="p-1">
                                                    0
                                                </td>
                                                <td class="p-1">
                                                    0
                                                </td>
                                            </tr>
                                        </table>
                                    </div>
                                </div>
                            </div>

                            <!--Calender Block-->
                            <div class="grid-box shadow calender rounded p-3">
                                <table class="rounded w-100 h-100">
                                    <tbody id="calender_table_body">
                                    </tbody>
                                </table>
                            </div>

                            <!--Clock Block-->
                            <div class="clock rounded text-center">
                                <div>16:17:16</div>
                                <hr/>
                                <div>August 11</div>
                            </div>
                            <div class="grid-box shadow todo rounded"></div>
                            <div class="grid-box shadow notes rounded"></div>
                        </div>
                    </main>
                </div>
            </div>
            <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
            <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
        </body>
        <script type="module" src="./script.js"></script>
    </body>
</html>
